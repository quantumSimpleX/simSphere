<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simSphere — 3D Light &amp; Sphere Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #0d0d10; color: #d8d8dc; font-family: system-ui, -apple-system, sans-serif; }
  #app { display: flex; height: 100%; }
  #scene { flex: 1; min-width: 0; position: relative; }
  #title {
    position: absolute; top: 12px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  }
  #title h1 { font-size: clamp(19px, 4.5vw, 34px); letter-spacing: 0.02em; color: #f2f2f5; }
  #title h2 { font-size: clamp(12px, 2.6vw, 17px); font-weight: 400; color: #b8b8c2; margin-top: 2px; }
  #colorpath {
    position: absolute; top: 96px; left: 10px; width: 140px; height: 140px;
    pointer-events: none;
  }
  #rgbpath {
    position: absolute; top: 246px; left: 10px; width: 140px; height: 140px;
    pointer-events: none;
  }
  #legend {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    max-width: 92%; padding: 6px 14px; border-radius: 8px;
    background: rgba(0, 0, 0, 0.55); font-size: 12px; color: #ddd;
    text-align: center; pointer-events: none; white-space: nowrap;
  }
  #legend b { color: #ffd479; }
  #scene canvas { display: block; }
  #panel {
    width: 300px; flex: none; overflow-y: auto; padding: 16px;
    background: #1a1a1f; border-left: 1px solid #2e2e36;
  }
  #panel h1 { font-size: 17px; margin-bottom: 2px; }
  #panel p.sub { font-size: 12px; color: #8a8a93; margin-bottom: 14px; }
  #panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #9a9aa4; margin: 16px 0 8px; border-bottom: 1px solid #2e2e36; padding-bottom: 4px;
  }
  .ctl { margin-bottom: 10px; }
  .ctl .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
  .ctl .row output { color: #ffd479; font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { width: 100%; accent-color: #ffb84d; }
  .ctl select {
    width: 100%; padding: 6px 8px; font-size: 13px;
    background: #26262e; color: #e2e2e6;
    border: 1px solid #3a3a44; border-radius: 6px;
  }
  .ctl select:focus { outline: 1px solid #ffb84d; }
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #scene { height: 58vh; flex: none; }
    #panel { width: 100%; flex: 1; border-left: none; border-top: 1px solid #2e2e36; }
    /* Smaller widgets, tucked into the top corners below the title. */
    #colorpath { top: 62px; left: 8px; width: 96px; height: 96px; }
    #rgbpath { top: 62px; left: auto; right: 8px; width: 96px; height: 96px; }
    #legend { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="scene"><div id="title"><h1>Prado 22 (m&amp;m)</h1><h2>Lighting Simulator</h2></div><canvas id="colorpath" width="280" height="280"></canvas><canvas id="rgbpath" width="280" height="280"></canvas><div id="legend"></div></div>
  <div id="panel">
    <h1>simSphere</h1>
    <p class="sub">Stone sphere lit by four rainbow-cycling spotlights (A–D, clockwise). Drag to orbit, scroll to zoom. Click/tap the scene or press Space to pause/resume the color cycling.</p>

    <h2>Animation</h2>
    <div class="ctl">
      <div class="row"><label for="speed">Cycle speed</label><output id="speed-v"></output></div>
      <input type="range" id="speed" min="0" max="24" step="1" value="16">
    </div>
    <div class="ctl">
      <div class="row"><label for="delay">Phase delay</label><output id="delay-v"></output></div>
      <input type="range" id="delay" min="0" max="49" step="1" value="5">
    </div>

    <h2>Light &amp; Beam</h2>
    <div class="ctl">
      <div class="row"><label for="ambient">Ambient light</label><output id="ambient-v"></output></div>
      <input type="range" id="ambient" min="0" max="1" step="0.01" value="0.1">
    </div>
    <div class="ctl">
      <div class="row"><label for="brightness">Spotlight brightness</label><output id="brightness-v"></output></div>
      <input type="range" id="brightness" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="ctl">
      <div class="row"><label for="beam">Beam angle (spread)</label><output id="beam-v"></output></div>
      <input type="range" id="beam" min="5" max="90" step="1" value="55">
    </div>
    <div class="ctl">
      <div class="row"><label for="aim">Angular aim (tilt)</label><output id="aim-v"></output></div>
      <input type="range" id="aim" min="-5" max="45" step="1" value="20">
    </div>
    <div class="ctl">
      <div class="row"><label for="heightPct">Spotlight height</label><output id="heightPct-v"></output></div>
      <input type="range" id="heightPct" min="0" max="100" step="1" value="10">
    </div>

    <h2>Geometry</h2>
    <div class="ctl">
      <div class="row"><label for="width">Landscape width</label><output id="width-v"></output></div>
      <input type="range" id="width" min="1" max="6" step="0.1" value="4">
    </div>
    <div class="ctl">
      <div class="row"><label for="length">Landscape length</label><output id="length-v"></output></div>
      <input type="range" id="length" min="1" max="6" step="0.1" value="5">
    </div>
    <div class="ctl">
      <div class="row"><label for="diameter">Sphere diameter</label><output id="diameter-v"></output></div>
      <input type="range" id="diameter" min="1" max="4" step="0.1" value="2">
    </div>

    <h2>Sphere Surface</h2>
    <div class="ctl">
      <div class="row"><label for="stone">Stone texture</label></div>
      <select id="stone">
        <option value="classic" selected>Classic gray stone</option>
        <option value="cement">Cement / concrete</option>
        <option value="granite">Granite (polished)</option>
        <option value="marble">Marble (polished)</option>
        <option value="travertine">Travertine</option>
        <option value="limestone">Limestone</option>
        <option value="sandstone">Sandstone</option>
        <option value="basalt">Basalt</option>
        <option value="slate">Slate</option>
      </select>
    </div>
    <div class="ctl">
      <div class="row"><label for="lightness">Lightness</label><output id="lightness-v"></output></div>
      <input type="range" id="lightness" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// All distances are in feet (1 world unit = 1 ft).
const P = {
  width: 4, length: 5, diameter: 2,
  ambient: 0.1, brightness: 1, beam: 55, aim: 20, heightPct: 10,
  speedIdx: 16, delayIdx: 5, lightness: 0.5,
};

// 25-step log scale: step 0 = frozen, steps 1–24 span 0.01–1 Hz.
function freq() {
  return P.speedIdx === 0 ? 0 : Math.pow(10, -2 + 2 * (P.speedIdx - 1) / 23);
}
// 50 linear steps over 0–3 s.
function delay() {
  return P.delayIdx * 3 / 49;
}

const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d10);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
// Start closer on narrow screens so the sphere fills the smaller canvas.
if (innerWidth < 700) camera.position.set(4.1, 3.4, 5.6);
else camera.position.set(5.5, 4.5, 7.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.52;

const ambient = new THREE.AmbientLight(0xffffff, P.ambient * 2);
scene.add(ambient);

// Speckled canvas texture gives the sphere a rough stone surface.
function makeNoiseTexture(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 150 + Math.random() * 105;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const noise = makeNoiseTexture(256);

const ground = new THREE.Mesh(
  new THREE.BoxGeometry(1, 0.2, 1),
  new THREE.MeshStandardMaterial({ color: 0x6e6f66, roughness: 0.95 })
);
ground.position.y = -0.1;
ground.receiveShadow = true;
scene.add(ground);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 96, 48),
  new THREE.MeshStandardMaterial({
    color: 0xc8c8c8, roughness: 0.92,
    bumpMap: noise, bumpScale: 0.02,
  })
);
sphere.castShadow = true;
sphere.receiveShadow = true;
scene.add(sphere);

// --- Procedural stone textures ---------------------------------------------
// Seamless value noise: lattice values come from a shuffled permutation table
// and lattice indices wrap at `period`, so any fBm whose base frequency is an
// integer tiles perfectly — no visible seam where the sphere's UVs wrap.
const PERM = new Uint8Array(256);
{
  let s = 1234567;
  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 256; i++) PERM[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [PERM[i], PERM[j]] = [PERM[j], PERM[i]];
  }
}
// `ch` offsets the lattice so different features (grain vs. pits vs. veins)
// draw from decorrelated noise fields while staying periodic.
function vnoise(x, y, period, ch = 0) {
  const o = ch * 37;
  const lat = (i, j) => {
    i = (((i + o) % period) + period) % period;
    j = (((j + o) % period) + period) % period;
    return PERM[(PERM[i & 255] + j) & 255] / 255;
  };
  const xi = Math.floor(x), yi = Math.floor(y);
  let tx = x - xi, ty = y - yi;
  tx = tx * tx * (3 - 2 * tx);
  ty = ty * ty * (3 - 2 * ty);
  const a = lat(xi, yi), b = lat(xi + 1, yi);
  const c = lat(xi, yi + 1), d = lat(xi + 1, yi + 1);
  return a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty;
}
// u, v ∈ [0,1); freq must be an integer for the result to tile.
function fbm(u, v, freq, oct, ch = 0) {
  let sum = 0, amp = 1, norm = 0, f = freq;
  for (let k = 0; k < oct; k++) {
    sum += amp * vnoise(u * f, v * f, f, ch + k);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
const mix3 = (a, b, t) => [
  a[0] + (b[0] - a[0]) * t,
  a[1] + (b[1] - a[1]) * t,
  a[2] + (b[2] - a[2]) * t,
];

// Each stone: pixel(u,v) → [r,g,b ∈ 0–255, height ∈ 0–1], plus material
// settings. `repeat` is integral in u so the texture tiles around the sphere.
const STONES = {
  classic: { roughness: 0.92, bumpScale: 0.02, tint: 0xc8c8c8, repeat: [1, 1] },
  cement: {
    roughness: 0.95, bumpScale: 0.025, tint: 0xffffff, repeat: [3, 2],
    pixel(u, v) {
      const mottle = fbm(u, v, 6, 3, 0);    // broad tonal patches
      const grain = fbm(u, v, 64, 2, 3);    // fine grit
      let t = 0.62 + (mottle - 0.5) * 0.18 + (grain - 0.5) * 0.14;
      let h = 0.5 + (grain - 0.5) * 0.6;
      const pit = vnoise(u * 96, v * 96, 96, 7); // small air bubbles
      if (pit > 0.93) {
        const k = (pit - 0.93) / 0.07;
        t -= k * 0.25; h -= k * 0.8;
      }
      const g = t * 255;
      return [g, g, g * 0.97, h];
    },
  },
  granite: {
    roughness: 0.3, bumpScale: 0.006, tint: 0xffffff, repeat: [3, 2],
    pixel(u, v) {
      const n1 = fbm(u, v, 28, 3, 10);
      const n2 = fbm(u, v, 40, 2, 14);
      const fine = vnoise(u * 128, v * 128, 128, 18);
      let c;
      if (n1 < 0.38) c = [42, 42, 48];          // biotite (black mica)
      else if (n1 > 0.66) c = [216, 213, 205];  // quartz / white feldspar
      else c = [138, 134, 132];                 // gray feldspar
      if (n2 > 0.72 && n1 >= 0.38) c = [196, 152, 134]; // pink feldspar
      const j = (fine - 0.5) * 22;
      return [c[0] + j, c[1] + j, c[2] + j, 0.5 + (fine - 0.5) * 0.25];
    },
  },
  marble: {
    roughness: 0.22, bumpScale: 0.004, tint: 0xffffff, repeat: [2, 1],
    pixel(u, v) {
      const warp = fbm(u, v, 4, 4, 22);
      const warp2 = fbm(u, v, 8, 3, 27);
      const s1 = Math.sin((u * 3 + warp * 2.5) * Math.PI * 2 + warp2 * 3);
      const vein = Math.pow(1 - Math.abs(s1), 14);          // primary veins
      const s2 = Math.sin((v * 2 + warp2 * 3) * Math.PI * 2 + warp * 2);
      const vein2 = Math.pow(1 - Math.abs(s2), 18) * 0.5;   // fainter cross veins
      const cloud = (fbm(u, v, 10, 3, 31) - 0.5) * 14;
      const c = mix3([235, 234, 230], [108, 110, 122], Math.min(1, vein + vein2));
      return [c[0] + cloud, c[1] + cloud, c[2] + cloud, 0.5 - vein * 0.2];
    },
  },
  travertine: {
    roughness: 0.8, bumpScale: 0.04, tint: 0xffffff, repeat: [2, 1],
    pixel(u, v) {
      const warp = fbm(u, v, 5, 3, 40);
      const band = Math.sin((v * 6 + warp * 1.2) * Math.PI * 2) * 0.5 + 0.5;
      let c = mix3([224, 207, 176], [192, 164, 122], band);
      c = mix3(c, [206, 186, 150], fbm(u, v, 24, 3, 44));
      let h = 0.6;
      const pit = fbm(u, v, 48, 2, 47); // the porous holes travertine is known for
      if (pit > 0.62) {
        const k = Math.min(1, (pit - 0.62) / 0.1);
        c = mix3(c, [96, 78, 56], k * 0.8);
        h -= k * 0.9;
      }
      return [c[0], c[1], c[2], h];
    },
  },
  limestone: {
    roughness: 0.9, bumpScale: 0.02, tint: 0xffffff, repeat: [3, 2],
    pixel(u, v) {
      const mottle = fbm(u, v, 8, 4, 72);
      const grain = fbm(u, v, 70, 2, 76);
      let c = mix3([207, 201, 184], [176, 168, 148], mottle);
      const j = (grain - 0.5) * 22;
      let h = 0.5 + (grain - 0.5) * 0.4;
      const fossil = vnoise(u * 60, v * 60, 60, 79); // pale shell flecks
      if (fossil > 0.94) {
        const k = (fossil - 0.94) / 0.06;
        c = mix3(c, [232, 228, 214], k);
        h += k * 0.3;
      }
      return [c[0] + j, c[1] + j, c[2] + j, h];
    },
  },
  sandstone: {
    roughness: 0.95, bumpScale: 0.03, tint: 0xffffff, repeat: [2, 1],
    pixel(u, v) {
      const warp = fbm(u, v, 6, 3, 62);
      const strata = Math.sin((v * 8 + warp * 0.9) * Math.PI * 2) * 0.5 + 0.5;
      let c = mix3([209, 168, 116], [176, 128, 80], strata);
      const grain = fbm(u, v, 90, 2, 66);
      const stain = fbm(u, v, 12, 3, 69); // iron-oxide staining
      c = mix3(c, [150, 96, 60], Math.max(0, stain - 0.6) * 1.5);
      const j = (grain - 0.5) * 40;
      return [c[0] + j, c[1] + j * 0.9, c[2] + j * 0.8,
        0.5 + (grain - 0.5) * 0.5 + (strata - 0.5) * 0.2];
    },
  },
  basalt: {
    roughness: 0.9, bumpScale: 0.03, tint: 0xffffff, repeat: [3, 2],
    pixel(u, v) {
      const fine = fbm(u, v, 80, 2, 52);
      const mottle = fbm(u, v, 10, 3, 55);
      let t = 0.24 + (mottle - 0.5) * 0.08 + (fine - 0.5) * 0.1;
      let h = 0.5 + (fine - 0.5) * 0.4;
      const ves = vnoise(u * 110, v * 110, 110, 58); // gas vesicles
      if (ves > 0.9) {
        const k = (ves - 0.9) / 0.1;
        t -= k * 0.12; h -= k;
      }
      const g = Math.max(0, t) * 255;
      return [g, g, g * 1.06 + 4, h]; // slight blue-gray cast
    },
  },
  slate: {
    roughness: 0.6, bumpScale: 0.02, tint: 0xffffff, repeat: [2, 2],
    pixel(u, v) {
      // v is compressed so the noise reads as thin horizontal cleavage layers
      const lay = fbm(u, v * 6, 10, 4, 82);
      const sheen = fbm(u * 3, v, 8, 3, 87);
      let c = mix3([62, 68, 78], [88, 95, 106], lay);
      c = mix3(c, [70, 82, 80], Math.max(0, sheen - 0.55) * 1.2); // greenish patches
      const j = (vnoise(u * 100, v * 600, 100, 90) - 0.5) * 14;
      return [c[0] + j, c[1] + j, c[2] + j, 0.35 + lay * 0.3];
    },
  },
};

// Bake a stone's pixel function into color + bump CanvasTextures (cached).
const stoneCache = new Map();
function buildStone(key) {
  const def = STONES[key];
  if (!def.pixel) return { map: null, bump: noise }; // classic keeps the speckle bump
  const S = 512;
  const cols = document.createElement('canvas');
  const bmps = document.createElement('canvas');
  cols.width = cols.height = bmps.width = bmps.height = S;
  const cctx = cols.getContext('2d'), bctx = bmps.getContext('2d');
  const ci = cctx.createImageData(S, S), bi = bctx.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const [r, g, b, h] = def.pixel(x / S, y / S);
      const o = (y * S + x) * 4;
      ci.data[o] = Math.min(255, Math.max(0, r));
      ci.data[o + 1] = Math.min(255, Math.max(0, g));
      ci.data[o + 2] = Math.min(255, Math.max(0, b));
      ci.data[o + 3] = 255;
      bi.data[o] = bi.data[o + 1] = bi.data[o + 2] =
        Math.min(255, Math.max(0, h * 255));
      bi.data[o + 3] = 255;
    }
  }
  cctx.putImageData(ci, 0, 0);
  bctx.putImageData(bi, 0, 0);
  // The texture wraps a separate display canvas so the lightness slider can
  // recomposite (pristine base + white overlay) without re-running the bake.
  const disp = document.createElement('canvas');
  disp.width = disp.height = S;
  const map = new THREE.CanvasTexture(disp);
  map.colorSpace = THREE.SRGBColorSpace;
  const bump = new THREE.CanvasTexture(bmps);
  for (const t of [map, bump]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(def.repeat[0], def.repeat[1]);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  return { map, bump, base: cols };
}

let currentStone = 'classic';
function applyStone(key) {
  currentStone = key;
  const def = STONES[key];
  if (!stoneCache.has(key)) stoneCache.set(key, buildStone(key));
  const tex = stoneCache.get(key);
  const m = sphere.material;
  m.map = tex.map;
  m.bumpMap = tex.bump;
  m.bumpScale = def.bumpScale;
  m.roughness = def.roughness;
  m.needsUpdate = true;
  applyLightness();
}

// Blend the stone color toward white: 0 = original color, 1 = fully white.
const WHITE = new THREE.Color(0xffffff);
function applyLightness() {
  const def = STONES[currentStone];
  const tex = stoneCache.get(currentStone);
  const L = P.lightness;
  if (tex.map) {
    const c = tex.map.image, ctx = c.getContext('2d');
    ctx.drawImage(tex.base, 0, 0);
    if (L > 0) {
      ctx.fillStyle = `rgba(255,255,255,${L})`;
      ctx.fillRect(0, 0, c.width, c.height);
    }
    tex.map.needsUpdate = true;
  }
  sphere.material.color.set(def.tint).lerp(WHITE, L);
}

// Lights A–D, clockwise around the landscape corners.
const CORNERS = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
const lights = CORNERS.map(([sx, sz]) => {
  const spot = new THREE.SpotLight(0xff0000, 0, 0, 1, 0.35, 2);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  spot.shadow.bias = -0.0002;
  spot.shadow.normalBias = 0.02;
  const target = new THREE.Object3D();
  spot.target = target;
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 16, 8),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );
  marker.material.toneMapped = false;
  scene.add(spot, target, marker);
  return { spot, target, marker, sx, sz };
});

function layout() {
  ground.scale.set(P.width, 1, P.length);
  sphere.scale.setScalar(P.diameter);
  sphere.position.y = P.diameter / 2;
  const h = (P.heightPct / 100) * (P.diameter / 2);
  const tilt = THREE.MathUtils.degToRad(P.aim);
  for (const L of lights) {
    const x = L.sx * P.width / 2, z = L.sz * P.length / 2;
    L.spot.position.set(x, h, z);
    L.marker.position.set(x, h, z);
    // Aim horizontally toward the center, then tilt up/down by the aim angle.
    const hl = Math.hypot(x, z);
    L.target.position.set(
      x + (-x / hl) * Math.cos(tilt) * 3,
      h + Math.sin(tilt) * 3,
      z + (-z / hl) * Math.cos(tilt) * 3
    );
    L.spot.angle = THREE.MathUtils.degToRad(P.beam) / 2;
  }
}

// Rainbow key colors (sRGB), converted to linear for lighting.
const KEYS = [
  [1, 0, 0],        // red
  [1, 0.5, 0],      // orange
  [1, 1, 0],        // yellow
  [0, 1, 0],        // green
  [0, 0, 1],        // blue
  [0.29, 0, 0.51],  // indigo
  [0.58, 0, 0.83],  // violet
].map(([r, g, b]) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace));

// Perceived-luminance compensation: light intensity is scaled by
// REF_LUM / luminance(color) so e.g. yellow doesn't look brighter than blue.
const REF_LUM = 0.18;
const BASE_INTENSITY = 14; // brightness 1 ≈ an 800 lm spotlight at this scene scale
const tmp = new THREE.Color();

// Closed Catmull-Rom spline through the key colors, so the color velocity
// is continuous at every key — no visible "corner" at indigo/violet.
function splineColor(u, target) {
  const s = u * 7, seg = Math.floor(s) % 7, t = s - Math.floor(s);
  const p0 = KEYS[(seg + 6) % 7], p1 = KEYS[seg];
  const p2 = KEYS[(seg + 1) % 7], p3 = KEYS[(seg + 2) % 7];
  const cr = (a, b, c, d) => {
    const v = 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t
      + (3 * b - a - 3 * c + d) * t * t * t);
    return Math.min(1, Math.max(0, v));
  };
  return target.setRGB(
    cr(p0.r, p1.r, p2.r, p3.r),
    cr(p0.g, p1.g, p2.g, p3.g),
    cr(p0.b, p1.b, p2.b, p3.b)
  );
}

const lumOf = c => c.r * 0.2126 + c.g * 0.7152 + c.b * 0.0722;

// Equal time per spline segment makes short color hops (blue→indigo) crawl
// and long ones (violet→red) rush, which reads as a jump. Reparameterize by
// arc length so the perceived color speed is constant: the lookup table maps
// uniform progress to spline position, with distances measured in
// gamma-encoded space on luminance-normalized colors (what the eye sees).
const LUT_N = 1024;
const uLUT = new Float32Array(LUT_N + 1);
{
  const N = 4096;
  const cum = new Float32Array(N + 1);
  const a = new THREE.Color(), b = new THREE.Color();
  const sample = (i, c) => {
    splineColor((i % N) / N, c);
    c.multiplyScalar(REF_LUM / Math.max(lumOf(c), 0.005));
    c.convertLinearToSRGB();
  };
  sample(0, a);
  for (let i = 1; i <= N; i++) {
    sample(i, b);
    cum[i] = cum[i - 1] + Math.hypot(b.r - a.r, b.g - a.g, b.b - a.b);
    a.copy(b);
  }
  let j = 0;
  for (let k = 0; k <= LUT_N; k++) {
    const goal = (k / LUT_N) * cum[N];
    while (j < N - 1 && cum[j + 1] < goal) j++;
    const f = cum[j + 1] === cum[j] ? 0 : (goal - cum[j]) / (cum[j + 1] - cum[j]);
    uLUT[k] = (j + f) / N;
  }
}

// Color at uniform progress u ∈ [0,1) along the rainbow loop.
function pathColor(u, target) {
  const p = u * LUT_N, k = Math.floor(p);
  const s = uLUT[k] + (uLUT[Math.min(k + 1, LUT_N)] - uLUT[k]) * (p - k);
  return splineColor(s % 1, target);
}

// --- Color-path widget: the rainbow loop as a ring, with markers A–D ---
const cpCanvas = document.getElementById('colorpath');
const cpCtx = cpCanvas.getContext('2d');
const CP_S = 280, CP_C = CP_S / 2, CP_R = 110;

// The ring itself never changes, so draw it once to an offscreen canvas.
const ringImg = document.createElement('canvas');
ringImg.width = ringImg.height = CP_S;
{
  const ctx = ringImg.getContext('2d');
  ctx.lineWidth = 14;
  for (let i = 0; i < 360; i++) {
    const a0 = (i / 360) * 2 * Math.PI - Math.PI / 2;
    const a1 = ((i + 1.5) / 360) * 2 * Math.PI - Math.PI / 2;
    ctx.strokeStyle = '#' + pathColor(i / 360, tmp).getHexString();
    ctx.beginPath();
    ctx.arc(CP_C, CP_C, CP_R, a0, a1);
    ctx.stroke();
  }
}

// --- CIE 1931 chromaticity widget: lights A–D as dots on the xy diagram ---
const rgbCanvas = document.getElementById('rgbpath');
const rgbCtx = rgbCanvas.getContext('2d');
const RP_S = 280;
// Spectral locus, CIE 1931 2° observer, 380–700 nm in 10 nm steps (x, y).
const LOCUS = [
  [.1741,.0050],[.1738,.0049],[.1733,.0048],[.1726,.0048],[.1714,.0051],
  [.1689,.0069],[.1644,.0109],[.1566,.0177],[.1440,.0297],[.1241,.0578],
  [.0913,.1327],[.0454,.2950],[.0082,.5384],[.0139,.7502],[.0743,.8338],
  [.1547,.8059],[.2296,.7543],[.3016,.6923],[.3731,.6245],[.4441,.5547],
  [.5125,.4866],[.5752,.4242],[.6270,.3725],[.6658,.3340],[.6915,.3083],
  [.7079,.2920],[.7190,.2809],[.7260,.2740],[.7300,.2700],[.7320,.2680],
  [.7334,.2666],[.7344,.2656],[.7347,.2653],
];
// Map chromaticity (x ∈ [0,0.8], y ∈ [0,0.9]) to canvas pixels.
const cieX = x => 14 + (x / 0.8) * 252;
const cieY = y => RP_S - 14 - (y / 0.9) * 252;

function insideLocus(x, y) {
  let inside = false;
  for (let i = 0, j = LOCUS.length - 1; i < LOCUS.length; j = i++) {
    const [xi, yi] = LOCUS[i], [xj, yj] = LOCUS[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

// Linear sRGB → CIE xy chromaticity.
function chromaticity(c) {
  const X = 0.4124 * c.r + 0.3576 * c.g + 0.1805 * c.b;
  const Y = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  const Z = 0.0193 * c.r + 0.1192 * c.g + 0.9505 * c.b;
  const s = X + Y + Z;
  return [cieX(X / s), cieY(Y / s)];
}

// Static background: the filled horseshoe, drawn once per pixel.
const cieImg = document.createElement('canvas');
cieImg.width = cieImg.height = RP_S;
{
  const ctx = cieImg.getContext('2d');
  const img = ctx.createImageData(RP_S, RP_S);
  const gamma = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  for (let py = 0; py < RP_S; py++) {
    const y = ((RP_S - 14 - py) / 252) * 0.9;
    for (let px = 0; px < RP_S; px++) {
      const x = ((px - 14) / 252) * 0.8;
      if (y <= 0.001 || !insideLocus(x, y)) continue;
      // xyY (Y=1) → XYZ → linear sRGB, normalized to fit the gamut.
      const X = x / y, Z = (1 - x - y) / y;
      let r = 3.2406 * X - 1.5372 - 0.4986 * Z;
      let g = -0.9689 * X + 1.8758 + 0.0415 * Z;
      let b = 0.0557 * X - 0.2040 + 1.0570 * Z;
      r = Math.max(r, 0); g = Math.max(g, 0); b = Math.max(b, 0);
      const m = Math.max(r, g, b);
      const o = (py * RP_S + px) * 4;
      img.data[o] = gamma(r / m) * 255;
      img.data[o + 1] = gamma(g / m) * 255;
      img.data[o + 2] = gamma(b / m) * 255;
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // Outline the locus and the purple line.
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  LOCUS.forEach(([x, y], i) => i ? ctx.lineTo(cieX(x), cieY(y)) : ctx.moveTo(cieX(x), cieY(y)));
  ctx.closePath();
  ctx.stroke();
}

function drawCIEPath(us) {
  rgbCtx.clearRect(0, 0, RP_S, RP_S);
  rgbCtx.drawImage(cieImg, 0, 0);
  rgbCtx.font = 'bold 14px system-ui, sans-serif';
  rgbCtx.textAlign = 'center';
  rgbCtx.textBaseline = 'middle';
  us.forEach((u, i) => {
    const [x, y] = chromaticity(pathColor(u, tmp));
    rgbCtx.beginPath();
    rgbCtx.arc(x, y, 13, 0, 2 * Math.PI);
    rgbCtx.fillStyle = '#' + tmp.getHexString();
    rgbCtx.fill();
    rgbCtx.lineWidth = 2;
    rgbCtx.strokeStyle = '#fff';
    rgbCtx.stroke();
    rgbCtx.fillStyle = '#fff';
    rgbCtx.fillText('ABCD'[i], x, y);
  });
}

function drawColorPath(us) {
  cpCtx.clearRect(0, 0, CP_S, CP_S);
  cpCtx.drawImage(ringImg, 0, 0);
  cpCtx.font = 'bold 14px system-ui, sans-serif';
  cpCtx.textAlign = 'center';
  cpCtx.textBaseline = 'middle';
  us.forEach((u, i) => {
    const a = u * 2 * Math.PI - Math.PI / 2;
    const x = CP_C + Math.cos(a) * CP_R, y = CP_C + Math.sin(a) * CP_R;
    cpCtx.beginPath();
    cpCtx.arc(x, y, 13, 0, 2 * Math.PI);
    cpCtx.fillStyle = '#' + pathColor(u, tmp).getHexString();
    cpCtx.fill();
    cpCtx.lineWidth = 2;
    cpCtx.strokeStyle = '#fff';
    cpCtx.stroke();
    cpCtx.fillStyle = '#fff';
    cpCtx.fillText('ABCD'[i], x, y);
  });
}

// Pause/resume the rainbow cycling with a click on the scene or the P key.
// The animation clock only advances while unpaused, so colors freeze in place.
let paused = false;
let animTime = 0;
const legend = document.getElementById('legend');
// Touch hints only when no mouse/trackpad exists at all — a touchscreen
// laptop or Surface with a mouse attached still gets the desktop legend.
// Some Windows tablets misreport the media query, so also switch to the
// desktop legend the moment real mouse movement is detected.
let isTouch = !matchMedia('(any-pointer: fine)').matches;
addEventListener('pointermove', function onFirstMouse(e) {
  if (e.pointerType === 'mouse') {
    removeEventListener('pointermove', onFirstMouse);
    if (isTouch) { isTouch = false; updateLegend(); }
  }
});
function updateLegend() {
  if (isTouch) {
    legend.innerHTML = paused
      ? '⏸ Paused — <b>tap</b> to resume'
      : '<b>Tap</b> to pause &nbsp;•&nbsp; <b>Drag</b> to rotate &nbsp;•&nbsp; <b>2 fingers</b> to pan &amp; zoom';
  } else {
    legend.innerHTML = paused
      ? '⏸ Paused — <b>click</b> or <b>Space</b> to resume'
      : '<b>Click</b> or <b>Space</b> to pause &nbsp;•&nbsp; <b>Left-click + drag</b> to rotate &nbsp;•&nbsp; <b>Right-click + drag</b> to pan &nbsp;•&nbsp; <b>Scroll</b> to zoom';
  }
}
function togglePause() {
  paused = !paused;
  updateLegend();
}
updateLegend();
addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault(); // keep Space from scrolling or nudging focused sliders
    togglePause();
  }
});
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => {
  // Only the left button (or a touch) can start a pause toggle.
  downAt = e.button === 0 ? [e.clientX, e.clientY] : null;
});
renderer.domElement.addEventListener('pointerup', e => {
  // Only a click/tap (not a rotate or pan drag) toggles pause.
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) togglePause();
  downAt = null;
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (!paused) animTime += dt;
  const t = animTime;
  const f = freq(), d = delay();
  const us = lights.map((L, i) => {
    // Staggered starts: light i begins i × delay seconds after light A.
    const tt = Math.max(0, t - i * d);
    // 7 equal segments: R→O→Y→G→B→I→V→(wrap to R), so the violet→red
    // blend takes the same time as any other transition.
    const u = f === 0 ? 0 : (tt * f) % 1;
    pathColor(u, tmp);
    const lum = tmp.r * 0.2126 + tmp.g * 0.7152 + tmp.b * 0.0722;
    L.spot.color.copy(tmp);
    L.spot.intensity = P.brightness * BASE_INTENSITY * (REF_LUM / Math.max(lum, 0.005));
    L.marker.material.color.copy(tmp);
    return u;
  });
  drawColorPath(us);
  drawCIEPath(us);
  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(container);

// ---- UI wiring ----
function bind(id, key, fmt, after) {
  const el = document.getElementById(id);
  const out = document.getElementById(id + '-v');
  const apply = () => {
    P[key] = parseFloat(el.value);
    out.textContent = fmt(P[key]);
    if (after) after();
  };
  el.addEventListener('input', apply);
  apply();
}

const fmtFt = v => v.toFixed(1) + ' ft';

// Sphere diameter may not exceed the shorter landscape side.
function clampDiameter() {
  const el = document.getElementById('diameter');
  const max = Math.min(P.width, P.length);
  el.max = max;
  if (parseFloat(el.value) > max) el.value = max;
  P.diameter = parseFloat(el.value);
  document.getElementById('diameter-v').textContent = fmtFt(P.diameter);
  layout();
}

bind('width', 'width', fmtFt, clampDiameter);
bind('length', 'length', fmtFt, clampDiameter);
bind('diameter', 'diameter', fmtFt, layout);
bind('ambient', 'ambient', v => v.toFixed(2), () => { ambient.intensity = P.ambient * 2; });
bind('brightness', 'brightness', v => Math.round(v * 800) + ' lm');
bind('beam', 'beam', v => v + '°', layout);
bind('aim', 'aim', v => v + '°', layout);
bind('heightPct', 'heightPct', v => v + '%', layout);
bind('speed', 'speedIdx', () => {
  const f = freq();
  return f === 0 ? '0 Hz (static)' : (f < 0.1 ? f.toFixed(3) : f.toFixed(2)) + ' Hz';
});
bind('delay', 'delayIdx', () => parseFloat(delay().toFixed(3)) + ' s');

const stoneSel = document.getElementById('stone');
stoneSel.addEventListener('change', () => applyStone(stoneSel.value));
applyStone(stoneSel.value);
bind('lightness', 'lightness', v => v.toFixed(2), applyLightness);

// Size the canvas from the laid-out container *before* the first render so
// the sphere is perfectly round from frame one.
resize();
layout();
animate();
</script>
</body>
